{% load humanize %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ aksi }} Produk - Barri E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-card: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-soft: #87a99c;
            --accent-hover: #6f8f82;
            --border-color: #f1f2f6;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .admin-header {
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .admin-title p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 10px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-main);
            border-color: #e2e2e2;
            box-shadow: var(--shadow-soft);
        }

        .form-card {
            background-color: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0, 0, 0, 0.01);
            margin-bottom: 30px;
        }

        .input-wrapper-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* Target Otomatis untuk Mengubah Elemen Input Bawaan Django Form */
        .input-wrapper-group input, 
        .input-wrapper-group textarea,
        .input-wrapper-group select {
            width: 100%;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-wrapper-group input:focus, 
        .input-wrapper-group textarea:focus {
            border-color: var(--accent-soft);
        }

        /* Gaya Khusus untuk Input File Gambar Django */
        .input-wrapper-group input[type="file"] {
            padding: 8px;
            background-color: #fafafa;
            border-style: dashed;
            cursor: pointer;
        }

        .admin-action-row {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-base {
            padding: 14px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cancel {
            background-color: #f1f2f6;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-cancel:hover {
            background-color: #e4e5e9;
            color: var(--text-main);
        }

        .btn-submit-save {
            background-color: var(--accent-soft);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(135, 169, 156, 0.2);
        }

        .btn-submit-save:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 6px 16px rgba(135, 169, 156, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-card">
                <div class="input-wrapper-group">
                    <label class="form-label">Nama Lengkap Produk</label>
                    {{ form.nama }}
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="input-wrapper-group">
                        <label class="form-label">Kategori</label>
                        {{ form.kategori }}
                    </div>

                    <div class="input-wrapper-group">
                        <label class="form-label">Ketersediaan Stok</label>
                        {{ form.stok }}
                    </div>
                </div>

                <div class="input-wrapper-group">
                    <label class="form-label">Harga Jual Unit</label>
                    {{ form.harga }}
                </div>

                <div class="input-wrapper-group">
                    <label class="form-label">Spesifikasi / Deskripsi Lengkap</label>
                    {{ form.deskripsi }}
                </div>

                <div class="input-wrapper-group">
                    <label class="form-label">Berkas Foto Produk</label>
                    {{ form.gambar }}
                </div>
            </div>

            <div class="admin-action-row">
                <a href="{% url 'admin_dashboard' %}" class="btn-base btn-cancel">Batalkan</a>
                <button type="submit" class="btn-base btn-submit-save">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</body>

</html>
